<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poster 02 Linux File System Quiz</title>
<style>body{margin:0;font-family:Arial;background:#081426;color:#eef6ff}.w{max-width:980px;margin:auto;padding:24px}.hero,.card,.result,.stat{background:#102541;border:1px solid #2b4b70;border-radius:16px;padding:20px;margin:14px 0}.hero{background:linear-gradient(135deg,#15345f,#1d5a68)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{text-align:center;margin:0}.stat b{display:block;color:#ffd43b;font-size:22px}.bar{height:12px;background:#06101f;border-radius:999px;overflow:hidden;margin:16px 0}#progress{height:100%;width:0;background:linear-gradient(90deg,#4ba3ff,#37d67a)}button{padding:12px 16px;border:0;border-radius:10px;font-weight:700;margin:6px;cursor:pointer}.p{background:#ffd43b}.s{background:#4ba3ff;color:white}.d{background:#ff5d6c;color:white}.q{font-size:19px;font-weight:700;margin:10px 0}.opt{display:block;background:#173353;border:2px solid transparent;border-radius:10px;padding:11px;margin:8px 0}.opt:hover{border-color:#4ba3ff}.correct{border-color:#37d67a;background:#183e36}.wrong{border-color:#ff5d6c;background:#462535}.exp{display:none;background:#091a30;border-left:4px solid #9d6cff;padding:12px;margin-top:10px}.result{display:none;text-align:center}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}}</style></head>
<body><div class="w"><div class="hero"><h1>Linux File System Quiz</h1><p><b>Poster #02</b> — directories, navigation, storage, and commands</p><p>25 questions • 15-minute timer • explanations • shuffled reattempts</p></div>
<div class="stats"><div class="stat"><b id="timer">15:00</b>Time Left</div><div class="stat"><b id="answered">0/25</b>Answered</div><div class="stat"><b id="scoreLive">0</b>Score</div><div class="stat"><b id="attempt">1</b>Attempt</div></div>
<div class="bar"><div id="progress"></div></div><button class="p" onclick="submitQuiz()">Submit Quiz</button><button class="s" onclick="reattempt()">Reattempt & Shuffle</button><button class="d" onclick="clearA()">Clear Answers</button><div id="quiz"></div><div id="result" class="result"><h2 id="finalScore"></h2><p id="feedback"></p></div><p style="text-align:center;color:#b9c9dc">Linux & DevOps Visual Study Library • Poster #02 • Muhammad Khalid Khan</p></div>
<script>const originalQuestions=[{"q": "What is the Linux root directory?", "options": ["/", "/root", "/home", "/boot"], "answer": 0, "explanation": "`/` is the top of the Linux filesystem hierarchy."}, {"q": "Where are system configuration files usually stored?", "options": ["/etc", "/var", "/opt", "/srv"], "answer": 0, "explanation": "`/etc` stores system-wide configuration files."}, {"q": "Where are normal users' home directories usually stored?", "options": ["/home", "/root", "/usr", "/tmp"], "answer": 0, "explanation": "Normal user homes are usually under `/home`."}, {"q": "What is `/root`?", "options": ["The root user's home directory", "The filesystem root", "A temporary directory", "A boot partition"], "answer": 0, "explanation": "`/root` is the root user's home directory."}, {"q": "Where are logs commonly stored?", "options": ["/var/log", "/etc/log", "/usr/log", "/opt/log"], "answer": 0, "explanation": "Logs are commonly stored in `/var/log`."}, {"q": "Which directory contains device files?", "options": ["/dev", "/proc", "/sys", "/mnt"], "answer": 0, "explanation": "`/dev` contains device files."}, {"q": "Which directory contains bootloader and kernel files?", "options": ["/boot", "/bin", "/lib", "/srv"], "answer": 0, "explanation": "`/boot` contains boot-related files."}, {"q": "What type of filesystem is `/proc`?", "options": ["Virtual filesystem", "Physical partition", "Backup filesystem", "Network filesystem"], "answer": 0, "explanation": "`/proc` is virtual and exposes process and kernel data."}, {"q": "What is commonly exposed under `/sys`?", "options": ["Kernel and hardware information", "User passwords", "Source code", "Temporary files"], "answer": 0, "explanation": "`/sys` exposes devices, drivers, and kernel information."}, {"q": "What is `/tmp` mainly used for?", "options": ["Temporary files", "Permanent backups", "Kernel modules", "System accounts"], "answer": 0, "explanation": "`/tmp` stores temporary files."}, {"q": "Where is optional third-party software often installed?", "options": ["/opt", "/bin", "/run", "/media"], "answer": 0, "explanation": "`/opt` is commonly used for optional software."}, {"q": "Which directory is a common temporary mount point?", "options": ["/mnt", "/home", "/etc", "/proc"], "answer": 0, "explanation": "`/mnt` is commonly used for temporary manual mounts."}, {"q": "Which directory is commonly used for removable media?", "options": ["/media", "/srv", "/lib", "/root"], "answer": 0, "explanation": "`/media` is commonly used for USB and removable devices."}, {"q": "What does `pwd` display?", "options": ["Current working directory", "Current user", "Disk usage", "Permissions"], "answer": 0, "explanation": "`pwd` prints the current working directory."}, {"q": "Which command lists hidden files in long format?", "options": ["ls -la", "ls -h", "pwd -a", "find -h"], "answer": 0, "explanation": "`ls -la` includes hidden files and detailed information."}, {"q": "Which command moves to the parent directory?", "options": ["cd ..", "cd /", "cd ~", "cd -"], "answer": 0, "explanation": "`cd ..` moves one directory level up."}, {"q": "Which command moves to the current user's home?", "options": ["cd ~", "cd /", "cd ..", "cd ."], "answer": 0, "explanation": "`cd ~` moves to the current user's home directory."}, {"q": "Which command creates an empty file?", "options": ["touch file.txt", "mkdir file.txt", "cp file.txt", "cat file.txt"], "answer": 0, "explanation": "`touch` creates an empty file if it does not exist."}, {"q": "Which command creates a directory?", "options": ["mkdir project", "touch project", "mv project", "stat project"], "answer": 0, "explanation": "`mkdir` creates a directory."}, {"q": "Which command shows filesystem usage in human-readable form?", "options": ["df -h", "du -h", "ls -h", "fdisk -h"], "answer": 0, "explanation": "`df -h` shows mounted filesystem usage."}, {"q": "Which command shows a directory's total size?", "options": ["du -sh directory", "df -sh directory", "ls -sh directory", "stat -h directory"], "answer": 0, "explanation": "`du -sh` summarizes directory space usage."}, {"q": "Which command identifies a file's type?", "options": ["file filename", "type filename", "stat -t filename", "ls -type filename"], "answer": 0, "explanation": "`file` reports the likely file type."}, {"q": "Which command shows detailed file metadata?", "options": ["stat filename", "pwd filename", "cat filename", "du filename"], "answer": 0, "explanation": "`stat` shows inode, timestamps, ownership, and permissions."}, {"q": "Which command searches for `sshd_config` under `/etc`?", "options": ["find /etc -name 'sshd_config'", "grep /etc sshd_config", "locate /etc sshd_config", "ls /etc | sshd_config"], "answer": 0, "explanation": "`find /etc -name 'sshd_config'` searches recursively."}, {"q": "Which command can recursively delete files without confirmation?", "options": ["rm -rf", "cp -r", "mkdir -p", "ls -R"], "answer": 0, "explanation": "`rm -rf` is destructive and must be used carefully."}];let questions=[],seconds=900,timerId,attempt=1,submitted=false;
function sh(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function prep(){questions=sh(originalQuestions).map(q=>{let x=sh(q.options.map((t,i)=>({t,ok:i===q.answer})));return{q:q.q,explanation:q.explanation,options:x,answer:x.findIndex(o=>o.ok)}})}
function render(){quiz.innerHTML='';questions.forEach((q,i)=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<div style="color:#ffd43b;font-weight:700">Question ${i+1} of 25</div><div class="q">${q.q}</div>${q.options.map((o,j)=>`<label class="opt" id="o-${i}-${j}"><input type="radio" name="q${i}" value="${j}" onchange="update()"> ${String.fromCharCode(65+j)}. ${o.t}</label>`).join('')}<div class="exp" id="e-${i}"></div>`;quiz.appendChild(d)});update()}
function update(){let c=0;questions.forEach((_,i)=>{if(document.querySelector(`input[name=q${i}]:checked`))c++});answered.textContent=`${c}/25`;progress.style.width=`${c/25*100}%`}
function submitQuiz(auto=false){if(submitted)return;submitted=true;clearInterval(timerId);let s=0;questions.forEach((q,i)=>{let sel=document.querySelector(`input[name=q${i}]:checked`);document.querySelectorAll(`input[name=q${i}]`).forEach(x=>x.disabled=true);q.options.forEach((_,j)=>{let l=document.getElementById(`o-${i}-${j}`);if(j===q.answer)l.classList.add('correct');if(sel&&+sel.value===j&&j!==q.answer)l.classList.add('wrong')});if(sel&&+sel.value===q.answer)s++;let e=document.getElementById(`e-${i}`);e.style.display='block';e.innerHTML='<b>Explanation:</b> '+q.explanation});scoreLive.textContent=s;let p=Math.round(s/25*100);finalScore.textContent=`${s}/25 (${p}%)`;feedback.textContent=(auto?'Time expired. ':'')+(p>=90?'Excellent mastery of the Linux filesystem.':p>=75?'Very good work.':p>=60?'Good foundation—review missed topics.':'Review the poster and try again.');result.style.display='block';result.scrollIntoView({behavior:'smooth'})}
function start(){clearInterval(timerId);timerId=setInterval(()=>{seconds--;timer.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');if(seconds<=0)submitQuiz(true)},1000)}
function reattempt(){attempt++;document.getElementById('attempt').textContent=attempt;submitted=false;seconds=900;timer.textContent='15:00';result.style.display='none';scoreLive.textContent='0';prep();render();start();scrollTo({top:0,behavior:'smooth'})}
function clearA(){if(submitted)return;document.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);update()}
prep();render();start();</script></body></html>
