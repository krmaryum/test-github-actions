<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Poster 04 MCQ Quiz</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#081426;color:#eef6ff}.wrap{max-width:980px;margin:auto;padding:24px}.hero,.card,.result{background:#102541;border:1px solid #2b4b70;border-radius:18px;padding:22px;margin-bottom:18px}.hero{background:linear-gradient(135deg,#15345f,#3c246c)}h1{margin:0 0 8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.stat{background:#102541;border:1px solid #2b4b70;border-radius:12px;padding:12px;text-align:center}.stat b{display:block;font-size:22px;color:#ffd43b}.progressbar{height:12px;background:#06101f;border-radius:999px;overflow:hidden}.progress{height:100%;width:0;background:linear-gradient(90deg,#4ba3ff,#37d67a)}button{padding:12px 16px;border:0;border-radius:10px;font-weight:700;cursor:pointer;margin:10px 6px 10px 0}.primary{background:#ffd43b}.secondary{background:#4ba3ff;color:white}.danger{background:#ff5d6c;color:white}.q{font-size:19px;font-weight:700;margin:8px 0 14px}.opt{display:block;background:#16304f;border:2px solid transparent;border-radius:10px;padding:11px;margin:8px 0;cursor:pointer}.opt:hover{border-color:#4ba3ff}.correct{border-color:#37d67a;background:#183e36}.wrong{border-color:#ff5d6c;background:#462535}.exp{display:none;background:#091a30;border-left:4px solid #9d6cff;padding:12px;margin-top:10px}.result{display:none;text-align:center}.footer{text-align:center;color:#b9c9dc;padding:24px}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap"><div class="hero"><h1>Linux Special Permissions Quiz</h1><p>Poster #04 — SUID, SGID & Sticky Bit</p><p>25 questions • timer • answer checking • explanations • shuffled reattempts</p></div>
<div class="stats"><div class="stat"><b id="timer">15:00</b>Time Left</div><div class="stat"><b id="answered">0/25</b>Answered</div><div class="stat"><b id="scoreLive">0</b>Score</div><div class="stat"><b id="attempt">1</b>Attempt</div></div>
<div class="progressbar"><div class="progress" id="progress"></div></div>
<button class="primary" onclick="submitQuiz()">Submit Quiz</button><button class="secondary" onclick="reattemptQuiz()">Reattempt & Shuffle</button><button class="danger" onclick="clearAnswers()">Clear Answers</button>
<div id="quiz"></div><div id="result" class="result"><h2 id="finalScore"></h2><p id="feedback"></p></div><div class="footer">Linux & DevOps Visual Study Library • Muhammad Khalid Khan</div></div>
<script>
const originalQuestions = [{"q": "What does SUID stand for?", "options": ["Set User ID", "Secure User Identity", "System User ID", "Shared User Instruction"], "answer": 0, "explanation": "SUID means Set User ID and lets an executable run with the file owner's effective privileges."}, {"q": "Which octal value represents SUID?", "options": ["1", "2", "4", "7"], "answer": 2, "explanation": "SUID uses the special-permission value 4."}, {"q": "Which octal value represents SGID?", "options": ["1", "2", "4", "6"], "answer": 1, "explanation": "SGID uses the special-permission value 2."}, {"q": "Which octal value represents the Sticky Bit?", "options": ["1", "2", "4", "5"], "answer": 0, "explanation": "The Sticky Bit uses the value 1."}, {"q": "Where is SUID shown in ls -l output?", "options": ["Owner execute position", "Group execute position", "Others execute position", "File-type position"], "answer": 0, "explanation": "SUID appears in the owner execute position as s or S."}, {"q": "Where is SGID shown in ls -l output?", "options": ["Owner read position", "Owner execute position", "Group execute position", "Others execute position"], "answer": 2, "explanation": "SGID appears in the group execute position."}, {"q": "Where is the Sticky Bit shown in ls -l output?", "options": ["Owner execute position", "Group execute position", "Others execute position", "Group write position"], "answer": 2, "explanation": "The Sticky Bit appears in the others execute position."}, {"q": "What does lowercase s mean?", "options": ["Special bit and execute are set", "Special bit set but execute missing", "Sticky Bit is set", "File is secure"], "answer": 0, "explanation": "Lowercase s means the special bit and the related execute bit are both set."}, {"q": "What does uppercase S mean?", "options": ["Special bit is off", "Special bit on but execute off", "File is a socket", "File is secure"], "answer": 1, "explanation": "Uppercase S means SUID/SGID is set but the execute bit is missing."}, {"q": "What does lowercase t mean?", "options": ["Sticky Bit and execute are set", "Only execute is set", "Only Sticky Bit is set", "File is temporary"], "answer": 0, "explanation": "Lowercase t means Sticky Bit and others execute are both set."}, {"q": "Which command sets SUID symbolically?", "options": ["chmod g+s file", "chmod o+t file", "chmod u+s file", "chmod a+s file"], "answer": 2, "explanation": "Use chmod u+s file to set SUID."}, {"q": "Which command sets SGID on a directory?", "options": ["chmod u+s project", "chmod g+s project", "chmod o+t project", "chmod 4755 project"], "answer": 1, "explanation": "chmod g+s project sets SGID."}, {"q": "Which command sets the Sticky Bit?", "options": ["chmod u+s shared", "chmod g+s shared", "chmod +t shared", "chmod +x shared"], "answer": 2, "explanation": "chmod +t shared sets Sticky Bit."}, {"q": "What is the main effect of SGID on a directory?", "options": ["Files run as root", "New files inherit the directory group", "Only root can enter", "Files become read-only"], "answer": 1, "explanation": "SGID on a directory makes new files inherit the directory group."}, {"q": "What is the main purpose of the Sticky Bit?", "options": ["Encrypt files", "Force group inheritance", "Prevent deleting other users' files", "Run files as root"], "answer": 2, "explanation": "Sticky Bit protects users' files in shared writable directories."}, {"q": "Which directory commonly uses mode 1777?", "options": ["/root", "/etc", "/tmp", "/boot"], "answer": 2, "explanation": "/tmp commonly uses 1777."}, {"q": "What does mode 4755 represent?", "options": ["SUID plus 755", "SGID plus 755", "Sticky Bit plus 755", "All special bits plus 755"], "answer": 0, "explanation": "The leading 4 enables SUID."}, {"q": "What does mode 2775 represent?", "options": ["SUID on a private script", "SGID on a shared directory", "Sticky Bit on /tmp", "All special bits"], "answer": 1, "explanation": "The leading 2 enables SGID."}, {"q": "Which command sets Sticky Bit with full rwx for all?", "options": ["chmod 1777 shared", "chmod 2777 shared", "chmod 4777 shared", "chmod 7771 shared"], "answer": 0, "explanation": "1777 is Sticky Bit plus 777."}, {"q": "Why is /usr/bin/passwd a classic SUID example?", "options": ["It must edit protected password data safely", "It creates groups", "It mounts disks", "It changes file ownership"], "answer": 0, "explanation": "passwd needs controlled elevated privileges to update password data."}, {"q": "Which command finds SUID files?", "options": ["find / -type f -perm -4000 2>/dev/null", "grep -R SUID /", "ls -R / | chmod 4000", "find / -type d -perm -1000"], "answer": 0, "explanation": "-perm -4000 matches SUID files."}, {"q": "Which command finds SGID files?", "options": ["find / -type f -perm -2000 2>/dev/null", "find / -type f -perm -1000", "ls -l / | grep sticky", "chmod -R 2000 /"], "answer": 0, "explanation": "-perm -2000 matches SGID files."}, {"q": "What is a major risk of unsafe SUID programs?", "options": ["Privilege escalation", "Lower disk usage", "Faster execution", "Automatic backups"], "answer": 0, "explanation": "Vulnerable SUID binaries can enable privilege escalation."}, {"q": "What should admins do with unnecessary SUID/SGID files?", "options": ["Ignore them", "Audit and remove unnecessary bits", "Set all to 7777", "Move them to /tmp"], "answer": 1, "explanation": "Special-permission files should be audited regularly."}, {"q": "Which statement is correct?", "options": ["Special bits replace rwx", "Special bits work with rwx", "They apply only to Windows", "They cannot be numeric"], "answer": 1, "explanation": "Special permissions add behavior on top of normal rwx permissions."}];
let questions=[],seconds=900,timerId,attempt=1,submitted=false;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function prepare(){questions=shuffle(originalQuestions).map(q=>{const x=shuffle(q.options.map((t,i)=>({t,ok:i===q.answer})));return{q:q.q,explanation:q.explanation,options:x,answer:x.findIndex(v=>v.ok)}})}
function render(){const box=document.getElementById('quiz');box.innerHTML='';questions.forEach((q,i)=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<div style="color:#ffd43b;font-weight:700">Question ${i+1} of 25</div><div class="q">${q.q}</div>${q.options.map((o,j)=>`<label class="opt" id="o-${i}-${j}"><input type="radio" name="q${i}" value="${j}" onchange="updateProgress()"> ${String.fromCharCode(65+j)}. ${o.t}</label>`).join('')}<div class="exp" id="e-${i}"></div>`;box.appendChild(d)});updateProgress()}
function updateProgress(){let c=0;questions.forEach((_,i)=>{if(document.querySelector(`input[name=q${i}]:checked`))c++});answered.textContent=`${c}/25`;progress.style.width=`${c/25*100}%`}
function submitQuiz(auto=false){if(submitted)return;submitted=true;clearInterval(timerId);let s=0;questions.forEach((q,i)=>{const sel=document.querySelector(`input[name=q${i}]:checked`);document.querySelectorAll(`input[name=q${i}]`).forEach(x=>x.disabled=true);q.options.forEach((_,j)=>{if(j===q.answer)document.getElementById(`o-${i}-${j}`).classList.add('correct');if(sel&&+sel.value===j&&j!==q.answer)document.getElementById(`o-${i}-${j}`).classList.add('wrong')});if(sel&&+sel.value===q.answer)s++;const e=document.getElementById(`e-${i}`);e.style.display='block';e.innerHTML='<b>Explanation:</b> '+q.explanation});scoreLive.textContent=s;const p=Math.round(s/25*100);finalScore.textContent=`${s}/25 (${p}%)`;feedback.textContent=(auto?'Time expired. ':'')+(p>=90?'Excellent mastery!':p>=75?'Very good work.':p>=60?'Good foundation—review missed concepts.':'Review the poster and try again.');result.style.display='block';result.scrollIntoView({behavior:'smooth'})}
function tick(){timerId=setInterval(()=>{seconds--;timer.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');if(seconds<=0){clearInterval(timerId);submitQuiz(true)}},1000)}
function reattemptQuiz(){attempt++;document.getElementById('attempt').textContent=attempt;submitted=false;seconds=900;timer.textContent='15:00';result.style.display='none';scoreLive.textContent='0';prepare();render();clearInterval(timerId);tick();scrollTo({top:0,behavior:'smooth'})}
function clearAnswers(){if(submitted)return;document.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);updateProgress()}
prepare();render();tick();
</script></body></html>
